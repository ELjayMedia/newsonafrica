name: Android Release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play release track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - closed
          - open
          - production

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  build-and-release:
    name: Build & Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      release-version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          compile-sdk: ${{ env.ANDROID_COMPILE_SDK }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Calculate version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/android-v* ]]; then
            VERSION="${GITHUB_REF_NAME#android-v}"
          else
            VERSION="1.0.2"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Decode keystore
        working-directory: android
        run: |
          echo "${{ secrets.NOA_ANDROID_KEYSTORE }}" | base64 --decode > release.keystore
          echo "Keystore decoded: $(ls -la release.keystore)"

      - name: Build release AAB
        working-directory: android
        env:
          NOA_ANDROID_KEYSTORE: ${{ github.workspace }}/android/release.keystore
          NOA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NOA_ANDROID_KEYSTORE_PASSWORD }}
          NOA_ANDROID_KEY_ALIAS: ${{ secrets.NOA_ANDROID_KEY_ALIAS }}
          NOA_ANDROID_KEY_PASSWORD: ${{ secrets.NOA_ANDROID_KEY_PASSWORD }}
          NOA_ANDROID_KEYSTORE_TYPE: ${{ secrets.NOA_ANDROID_KEYSTORE_TYPE }}
        run: |
          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify AAB signature
        working-directory: android
        run: |
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: AAB not found at $AAB_PATH"
            exit 1
          fi
          echo "AAB built: $AAB_PATH ($(du -h "$AAB_PATH" | cut -f1))"
          jarsigner -verify -verbose -certs "$AAB_PATH" | head -20

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play
        if: ${{ github.event_name == 'push' || inputs.track != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          packageName: com.newsonafrica.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          inAppUpdatePriority: 5
          whatsNewDirectory: android/whatsnew/
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt

  verify-play-access:
    name: Verify Play Console Access
    runs-on: ubuntu-latest
    needs: build-and-release
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Google Play API access
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/verify-google-play-access.mjs