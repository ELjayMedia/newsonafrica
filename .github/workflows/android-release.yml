name: Android Release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name (for example 1.0.3)'
        required: true
        default: '1.0.3'
        type: string
      version_code:
        description: 'Optional version code; blank selects a new code automatically'
        required: false
        type: string
      publish_to_play:
        description: 'Upload the signed bundle to Google Play'
        default: false
        type: boolean
      track:
        description: 'Google Play API track (alpha = closed, beta = open testing)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

# Listing publishing uses the same group: Play edits must not overlap.
concurrency:
  group: google-play-com.newsonafrica.app
  cancel-in-progress: false

env:
  PUBLISH_TO_PLAY: ${{ github.event_name == 'push' || inputs.publish_to_play == true }}

jobs:
  build-and-release:
    name: Build AAB and optionally publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Calculate release version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: node scripts/android-release-version.mjs

      - name: Verify Google Play access and version code before building
        if: env.PUBLISH_TO_PLAY == 'true'
        id: play-access
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          NOA_ANDROID_VERSION_CODE: ${{ steps.version.outputs.version-code }}
          PLAY_AUTO_VERSION_CODE: ${{ inputs.version_code == '' }}
        run: node scripts/verify-google-play-access.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Decode and check signing credentials
        env:
          NOA_ANDROID_KEYSTORE: ${{ secrets.NOA_ANDROID_KEYSTORE }}
          NOA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NOA_ANDROID_KEYSTORE_PASSWORD }}
          NOA_ANDROID_KEY_ALIAS: ${{ secrets.NOA_ANDROID_KEY_ALIAS }}
          NOA_ANDROID_KEY_PASSWORD: ${{ secrets.NOA_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          for name in NOA_ANDROID_KEYSTORE NOA_ANDROID_KEYSTORE_PASSWORD NOA_ANDROID_KEY_ALIAS NOA_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$NOA_ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/newsonafrica-release.keystore"
          test -s "$RUNNER_TEMP/newsonafrica-release.keystore"

      - name: Build signed release AAB
        working-directory: android
        env:
          NOA_ANDROID_VERSION_NAME: ${{ steps.version.outputs.version-name }}
          NOA_ANDROID_VERSION_CODE: ${{ steps.play-access.outputs.version-code || steps.version.outputs.version-code }}
          NOA_ANDROID_KEYSTORE: ${{ runner.temp }}/newsonafrica-release.keystore
          NOA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NOA_ANDROID_KEYSTORE_PASSWORD }}
          NOA_ANDROID_KEY_ALIAS: ${{ secrets.NOA_ANDROID_KEY_ALIAS }}
          NOA_ANDROID_KEY_PASSWORD: ${{ secrets.NOA_ANDROID_KEY_PASSWORD }}
          NOA_ANDROID_KEYSTORE_TYPE: ${{ secrets.NOA_ANDROID_KEYSTORE_TYPE }}
        run: bash ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Verify AAB signature
        shell: bash
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB_PATH"
          jarsigner -verify -verbose -certs "$AAB_PATH" > "$RUNNER_TEMP/aab-signature.txt"
          cat "$RUNNER_TEMP/aab-signature.txt"
          grep -Fq 'jar verified.' "$RUNNER_TEMP/aab-signature.txt"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.version-name }}-${{ steps.play-access.outputs.version-code || steps.version.outputs.version-code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play
        if: env.PUBLISH_TO_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          packageName: com.newsonafrica.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          inAppUpdatePriority: 5
          whatsNewDirectory: android/whatsnew/
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/newsonafrica-release.keystore"
