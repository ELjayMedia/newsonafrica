#import "../../fragments/PostCardFields.graphql"

query Posts_LatestFeed($first: Int!, $after: String) {
  posts(
    first: $first
    after: $after
    where: {
      status: PUBLISH
      orderby: { field: DATE, order: DESC }
    }
  ) {
    pageInfo {
      endCursor
      hasNextPage
    }
    nodes {
      ...PostCardFields
    }
  }
}
