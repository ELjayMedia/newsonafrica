#import "../../fragments/PostCardFields.graphql"

query Posts_HomeFeed(
  $heroFirst: Int!
  $heroTagSlugs: [String!]
  $latestFirst: Int!
) {
  hero: posts(
    first: $heroFirst
    where: {
      status: PUBLISH
      orderby: { field: DATE, order: DESC }
      tagSlugIn: $heroTagSlugs
    }
  ) {
    nodes {
      ...PostCardFields
    }
  }
  latest: posts(
    first: $latestFirst
    where: {
      status: PUBLISH
      orderby: { field: DATE, order: DESC }
    }
  ) {
    pageInfo {
      endCursor
      hasNextPage
    }
    edges {
      cursor
      node {
        ...PostCardFields
      }
    }
  }
}
