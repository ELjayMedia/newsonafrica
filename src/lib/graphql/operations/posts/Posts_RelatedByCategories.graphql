#import "../../fragments/PostCardFields.graphql"

query Posts_RelatedByCategories($catIds: [ID!], $exclude: ID!, $first: Int!) {
  posts(
    first: $first
    where: {
      status: PUBLISH
      orderby: { field: DATE, order: DESC }
      notIn: [$exclude]
      categoryIn: $catIds
    }
  ) {
    nodes {
      ...PostCardFields
    }
  }
}
