query Authors_BySlug($slug: String!, $after: String, $first: Int!) {
  user(id: $slug, idType: SLUG) {
    id
    databaseId
    name
    slug
    description
    avatar {
      url
    }
    posts(first: $first, after: $after, where: { orderby: { field: DATE, order: DESC } }) {
      pageInfo {
        endCursor
        hasNextPage
      }
      nodes {
        databaseId
        id
        slug
        date
        title(format: RENDERED)
        excerpt(format: RENDERED)
      }
    }
  }
}
