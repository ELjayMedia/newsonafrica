query Taxonomy_TagFeed($tagSlugs: [String!]!, $first: Int!, $after: String) {
  posts(
    first: $first
    after: $after
    where: {
      status: PUBLISH
      orderby: { field: DATE, order: DESC }
      tagSlugIn: $tagSlugs
    }
  ) {
    pageInfo {
      endCursor
      hasNextPage
    }
    nodes {
      databaseId
      id
      slug
      date
      modified
      title(format: RENDERED)
      excerpt(format: RENDERED)
      uri
      link
    }
  }
}
