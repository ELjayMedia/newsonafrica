#import "../../fragments/CategoryChipFields.graphql"
#import "../../fragments/PostCardFields.graphql"

query Taxonomy_CategoryFeedBatch($slugs: [String!]!, $first: Int!) {
  categories(where: { slug: $slugs }) {
    nodes {
      ...CategoryChipFields
      posts(
        first: $first
        where: {
          status: PUBLISH
          orderby: { field: DATE, order: DESC }
        }
      ) {
        pageInfo {
          endCursor
          hasNextPage
        }
        nodes {
          ...PostCardFields
        }
      }
    }
  }
}
