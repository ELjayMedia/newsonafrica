#import "../../fragments/PostCardFields.graphql"

query Posts_RelatedByTags($tagSlugs: [String!]!, $exclude: ID!, $first: Int!) {
  posts(
    first: $first
    where: {
      status: PUBLISH
      orderby: { field: DATE, order: DESC }
      tagSlugIn: $tagSlugs
      notIn: [$exclude]
    }
  ) {
    nodes {
      ...PostCardFields
    }
  }
}
