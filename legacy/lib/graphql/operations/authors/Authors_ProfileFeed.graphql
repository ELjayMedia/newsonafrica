#import "../../fragments/AuthorBadgeFields.graphql"
#import "../../fragments/PostCardFields.graphql"

query Authors_ProfileFeed($slug: String!, $after: String, $first: Int!) {
  user(id: $slug, idType: SLUG) {
    ...AuthorBadgeFields
    posts(first: $first, after: $after, where: { orderby: { field: DATE, order: DESC } }) {
      pageInfo {
        endCursor
        hasNextPage
      }
      nodes {
        ...PostCardFields
      }
    }
  }
}
