#import "../../fragments/CategoryChipFields.graphql"
#import "../../fragments/PostCardFields.graphql"

query Taxonomy_CategoryFeed($slug: String!, $after: String, $first: Int!) {
  categories(where: { slug: [$slug] }) {
    nodes {
      ...CategoryChipFields
    }
  }
  posts(
    first: $first
    after: $after
    where: {
      status: PUBLISH
      orderby: { field: DATE, order: DESC }
      categoryName: $slug
    }
  ) {
    pageInfo {
      endCursor
      hasNextPage
    }
    nodes {
      ...PostCardFields
    }
  }
}
